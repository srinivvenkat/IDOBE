<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDOBE expert annotation</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.2/plotly-basic.min.js"></script>
</head>
<body>
<header class="top">
  <h1>IDOBE expert annotation</h1>
  <div class="who">
    <span id="who"></span>
    <a id="admin-link" href="/admin" hidden>Admin</a>
    <button class="link" id="logout">Sign out</button>
  </div>
</header>
<main class="wrap">
  <div class="progress" aria-live="polite">
    <span id="progress-text"></span>
  </div>

  <section class="card" id="annotate">
    <div class="notice" id="revisit-notice" hidden></div>
    <div class="meta" id="meta"></div>
    <div id="chart" role="img" aria-label="Weekly time series"></div>
    <details>
      <summary>Show values as a table</summary>
      <div class="table-wrap"><table id="values-table"></table></div>
    </details>

    <div class="controls">
      <div class="row" role="group" aria-label="Is this an outbreak?">
        <span class="lbl">Is this an outbreak?</span>
        <button class="label-btn" data-label="outbreak" aria-pressed="false">Outbreak<kbd>O</kbd></button>
        <button class="label-btn" data-label="not_outbreak" aria-pressed="false">Not an outbreak<kbd>N</kbd></button>
        <button class="label-btn" data-label="unsure" aria-pressed="false">Unsure<kbd>U</kbd></button>
      </div>
      <div class="row" role="group" aria-label="Confidence">
        <span class="lbl">Confidence</span>
        <button class="conf-btn" data-conf="1" aria-pressed="false">1</button>
        <button class="conf-btn" data-conf="2" aria-pressed="false">2</button>
        <button class="conf-btn" data-conf="3" aria-pressed="false">3</button>
        <button class="conf-btn" data-conf="4" aria-pressed="false">4</button>
        <button class="conf-btn" data-conf="5" aria-pressed="false">5</button>
        <span class="conf-hint">1 = guess · 5 = certain (keys 1–5)</span>
      </div>
      <div>
        <label class="lbl" for="comment" style="display:block;margin-bottom:4px;color:var(--text-secondary);font-size:14px">Comment (optional)</label>
        <textarea id="comment" maxlength="5000" placeholder="Anything notable: data artifacts, reporting changes, a different start/end…"></textarea>
      </div>
      <div class="actions">
        <div class="row">
          <button id="back" title="Previous series (B)">← Back<kbd>B</kbd></button>
          <button id="skip" title="Skip this series (S)">Skip<kbd>S</kbd></button>
        </div>
        <button class="primary" id="submit" disabled>Submit<kbd>Enter</kbd></button>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>
  </section>

  <section class="card done" id="done" hidden>
    <h2>All done</h2>
    <p>There are no more series for you to label right now. Thank you!</p>
  </section>

  <h2>My annotations</h2>
  <section class="card">
    <div class="table-wrap" style="max-height:none">
      <table id="mine"><thead><tr><th>ID</th><th>Disease</th><th>Location</th><th>Start</th><th>Label</th><th class="num">Conf.</th><th>When</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="pager">
      <button id="mine-prev">Newer</button><button id="mine-next">Older</button><span id="mine-info"></span>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
