# Local production-like stack (Postgres + app):
#   docker compose -f annotation/compose.yaml up --build
#   docker compose -f annotation/compose.yaml exec app python scripts/load_outbreaks.py
#   docker compose -f annotation/compose.yaml exec app python scripts/create_user.py admin --admin --generate
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idobe
      POSTGRES_PASSWORD: idobe
      POSTGRES_DB: idobe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idobe"]
      interval: 2s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: annotation/Dockerfile
    environment:
      DATABASE_URL: postgresql://idobe:idobe@db:5432/idobe
      SECRET_KEY: change-me-for-anything-but-local-testing
      COOKIE_SECURE: "false"   # plain http on localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
