<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetic Outbreaks — Interactive Explorer</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171d2b; --panel2:#1e2536; --ink:#e8ecf4; --muted:#93a0b8;
    --line:#2a3348; --accent:#6ea8fe;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f7fb; --panel:#ffffff; --panel2:#f0f3f9; --ink:#1a2030; --muted:#5a6a85; --line:#dde3ee; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);}
  header{padding:20px 24px 8px;}
  h1{font-size:20px;margin:0 0 4px;font-weight:700;}
  .sub{color:var(--muted);font-size:13px;margin:0;}
  .wrap{display:flex;gap:16px;padding:16px 24px 32px;align-items:flex-start;flex-wrap:wrap;}
  .controls{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;
            width:240px;flex:0 0 240px;position:sticky;top:12px;}
  .controls h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
               margin:0 0 8px;font-weight:600;}
  .ctl{margin-bottom:16px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  select{width:100%;padding:7px 8px;border-radius:8px;border:1px solid var(--line);
         background:var(--panel2);color:var(--ink);font-size:13px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{flex:1;padding:7px 4px;border:0;background:var(--panel2);color:var(--muted);
              font-size:12px;cursor:pointer;}
  .seg button.on{background:var(--accent);color:#08111f;font-weight:600;}
  .legend{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto;}
  .lg{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12.5px;}
  .lg:hover{background:var(--panel2);}
  .lg.off{opacity:.35;}
  .sw{width:12px;height:12px;border-radius:3px;flex:0 0 12px;}
  .lg .cnt{margin-left:auto;color:var(--muted);font-size:11px;}
  .chartbox{flex:1 1 520px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
            padding:12px;min-width:340px;position:relative;}
  svg{width:100%;height:auto;display:block;}
  .axis line,.axis path{stroke:var(--line);}
  .axis text{fill:var(--muted);font-size:11px;}
  .glabel{fill:var(--muted);font-size:12px;}
  path.curve{fill:none;stroke-width:1.3;opacity:.35;cursor:pointer;transition:opacity .1s;}
  path.curve.dim{opacity:.06;}
  path.curve.hot{opacity:1;stroke-width:2.6;}
  .tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);
       border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);
       opacity:0;transition:opacity .08s;max-width:230px;z-index:5;}
  .tip b{color:var(--ink);} .tip .m{color:var(--muted);}
  .count{font-size:12px;color:var(--muted);padding:0 24px 8px;}
</style>
</head>
<body>
<header>
  <h1>Synthetic Outbreaks — Interactive Explorer</h1>
  <p class="sub">100 synthetic outbreak time series. Hover a curve for details; use the controls to filter.</p>
</header>
<div class="count" id="count"></div>
<div class="wrap">
  <div class="controls">
    <h2>Filters</h2>
    <div class="ctl">

      <select id="event"><option value="ALL">All events</option></select>
    </div>
    <div class="ctl">
      <label>Y-axis scale</label>
      <div class="seg" id="scale">
        <button data-v="norm" class="on">Peak = 1</button>
        <button data-v="raw">Raw</button>
        <button data-v="log">Log</button>
      </div>
    </div>
    <div class="ctl">
      <h2>Diseases</h2>
      <div class="legend" id="legend"></div>
    </div>
  </div>
  <div class="chartbox">
    <svg id="chart" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tip" id="tip"></div>
  </div>
</div>

 0.2215, 0.738, 2.8088, 2.2317, 0.7518, 1.6524, 0.4203, 1.6324, 2.852, 0.5916, 0.0, 0.2373, 0.3524, 0.4999, 0.738, 0.6271, 0.1439, 0.0, 0.0]}, {"id": 99, "disease": "POLIOMYELITIS", "location": "NEW JERSEY", "event": "CASES", "start": "1930-01-25", "end": "1930-07-12", "duration": 16, "total": 9.0, "values": [0.3231, 0.1461, 0.1145, 0.1594, 0.1575, 0.2096, 0.4697, 0.9536, 0.7497, 0.0, 0.0306, 0.5842, 1.0309, 1.4244, 0.7696, 0.0223, 0.0, 0.0, 0.0774, 0.0128, 0.0402, 0.1053, 0.2633, 0.4427, 0.9128]}, {"id": 100, "disease": "MEASLES", "location": "KENTUCKY", "event": "CASES", "start": "1976-09-25", "end": "1977-04-09", "duration": 20, "total": 153.0, "values": [7.2006, 6.4943, 6.1901, 4.9201, 4.6987, 5.7351, 7.2802, 9.0064, 11.2712, 13.0485, 10.2291, 6.7754, 7.4278, 8.5692, 7.9544, 10.4869, 6.7857, 0.1059, 2.4641, 1.6116, 0.1598, 2.6891, 2.7469, 1.7291, 1.4845, 1.8709, 1.4546, 0.6491, 1.9602]}];
const NS="http://www.w3.org/2000/svg";
const W=900,H=520,M={t:18,r:16,b:44,l:56};
const iw=W-M.l-M.r, ih=H-M.t-M.b;
const PALETTE=["#6ea8fe","#f6a04d","#63c98b","#ef6f6f","#b48ef2","#c08a6a","#ef8fc4","#c9c04a","#54c8d8","#9aa5b8"];
const diseases=[...new Set(DATA.map(d=>d.disease))];
const color=Object.fromEntries(diseases.map((d,i)=>[d,PALETTE[i%PALETTE.length]]));
const state={event:"ALL",scale:"norm",off:new Set()};

// event dropdown
const evSel=document.getElementById("event");
[...new Set(DATA.map(d=>d.event))].forEach(e=>{
  const o=document.createElement("option");o.value=e;o.textContent=e;evSel.appendChild(o);
});
evSel.onchange=()=>{state.event=evSel.value;render();};

// scale segmented
document.querySelectorAll("#scale button").forEach(b=>{
  b.onclick=()=>{document.querySelectorAll("#scale button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");state.scale=b.dataset.v;render();};
});

// legend
const leg=document.getElementById("legend");
diseases.forEach(d=>{
  const row=document.createElement("div");row.className="lg";row.dataset.d=d;
  const cnt=DATA.filter(x=>x.disease===d).length;
  row.innerHTML=`<span class="sw" style="background:${color[d]}"></span><span>${d}</span><span class="cnt">${cnt}</span>`;
  row.onclick=()=>{state.off.has(d)?state.off.delete(d):state.off.add(d);
    row.classList.toggle("off");render();};
  leg.appendChild(row);
});

const svg=document.getElementById("chart");
const tip=document.getElementById("tip");
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

function visible(){
  return DATA.filter(d=>(state.event==="ALL"||d.event===state.event) && !state.off.has(d.disease));
}
function transform(vals){
  if(state.scale==="norm"){const mx=Math.max(...vals);return mx>0?vals.map(v=>v/mx):vals;}
  return vals.slice();
}

function render(){
  const rows=visible();
  document.getElementById("count").textContent=`Showing ${rows.length} of ${DATA.length} outbreaks`;
  while(svg.firstChild)svg.removeChild(svg.firstChild);

  // x domain = max length
  let maxLen=0, yMax=0, yMinPos=Infinity;
  rows.forEach(d=>{const t=transform(d.values);maxLen=Math.max(maxLen,t.length);
    t.forEach(v=>{if(v>yMax)yMax=v; if(v>0&&v<yMinPos)yMinPos=v;});});
  if(maxLen<2)maxLen=2; if(yMax<=0)yMax=1;
  const log=state.scale==="log";
  if(log && !isFinite(yMinPos))yMinPos=1;
  const x=i=>M.l + (i/(maxLen-1))*iw;
  const yScale=v=>{
    if(log){const lo=Math.log10(yMinPos), hi=Math.log10(yMax);
      const vv=Math.max(v,yMinPos);return M.t+ih-((Math.log10(vv)-lo)/(hi-lo||1))*ih;}
    return M.t+ih-(v/yMax)*ih;
  };

  // grid + y axis
  const g=el("g",{class:"axis"});svg.appendChild(g);
  const ticks=5;
  for(let i=0;i<=ticks;i++){
    let val,yp;
    if(log){const lo=Math.log10(yMinPos),hi=Math.log10(yMax);
      const lv=lo+(hi-lo)*i/ticks;val=Math.pow(10,lv);yp=yScale(val);}
    else{val=yMax*i/ticks;yp=yScale(val);}
    g.appendChild(el("line",{x1:M.l,x2:W-M.r,y1:yp,y2:yp}));
    const tx=el("text",{x:M.l-8,y:yp+3,"text-anchor":"end"});
    tx.textContent=fmt(val);g.appendChild(tx);
  }
  // x axis
  const xt=6;
  for(let i=0;i<=xt;i++){
    const wk=Math.round((maxLen-1)*i/xt), xp=x(wk);
    g.appendChild(el("line",{x1:xp,x2:xp,y1:M.t+ih,y2:M.t+ih+5}));
    const tx=el("text",{x:xp,y:M.t+ih+18,"text-anchor":"middle"});tx.textContent=wk;g.appendChild(tx);
  }
  // axis labels
  const xl=el("text",{x:M.l+iw/2,y:H-6,"text-anchor":"middle",class:"glabel"});
  xl.textContent="Weeks since outbreak start";svg.appendChild(xl);
  const yl=el("text",{x:14,y:M.t+ih/2,"text-anchor":"middle",class:"glabel",
    transform:`rotate(-90 14 ${M.t+ih/2})`});
  yl.textContent=({norm:"Intensity (peak = 1)",raw:"Value",log:"Value (log)"})[state.scale];
  svg.appendChild(yl);

  // curves
  rows.forEach(d=>{
    const t=transform(d.values);
    let path="";
    t.forEach((v,i)=>{const X=x(i).toFixed(1),Y=yScale(v).toFixed(1);path+=(i?"L":"M")+X+" "+Y+" ";});
    const p=el("path",{class:"curve",d:path,stroke:color[d.disease]});
    p._d=d; p._t=t;
    svg.appendChild(p);
  });
}
function clearHot(){
  svg.querySelectorAll("path.curve").forEach(q=>q.classList.remove("dim","hot"));
  tip.style.opacity=0;
}
// event delegation — robust against DOM changes / fast pointer moves
svg.addEventListener("mouseover",ev=>{
  const p=ev.target.closest("path.curve"); if(!p)return;
  svg.querySelectorAll("path.curve").forEach(q=>{q.classList.add("dim");q.classList.remove("hot");});
  p.classList.remove("dim"); p.classList.add("hot");
});
svg.addEventListener("mousemove",ev=>{
  const p=ev.target.closest("path.curve");
  if(p) showTip(ev,p._d,p._t);
});
svg.addEventListener("mouseout",ev=>{
  const to=ev.relatedTarget;
  if(!to || !to.closest || !to.closest("path.curve")) clearHot();
});
svg.addEventListener("mouseleave",clearHot);
function fmt(v){
  if(v===0)return "0";
  if(v>=1e6)return (v/1e6).toFixed(1)+"M";
  if(v>=1e3)return (v/1e3).toFixed(1)+"k";
  if(v>=10)return v.toFixed(0);
  if(v>=1)return v.toFixed(1);
  return v.toFixed(2);
}
function showTip(ev,d,t){
  const box=document.querySelector(".chartbox").getBoundingClientRect();
  const px=ev.clientX-box.left, py=ev.clientY-box.top;
  tip.innerHTML=`<b>${d.disease}</b> — ${d.location}<br>
    <span class="m">Event:</span> ${d.event}<br>
    <span class="m">Window:</span> ${d.start} → ${d.end}<br>
    <span class="m">Duration:</span> ${d.duration} &nbsp; <span class="m">Total:</span> ${fmt(d.total)}<br>
    <span class="m">Peak intensity:</span> ${fmt(Math.max(...d.values))}`;
  tip.style.opacity=1;
  let lx=px+14, ly=py+14;
  if(lx+240>box.width)lx=px-244;
  if(ly+120>box.height)ly=py-120;
  tip.style.left=lx+"px";tip.style.top=ly+"px";
}
render();
</script>
